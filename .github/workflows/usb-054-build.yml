name: Cherry USB 0.5.4 hotfix build (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usb-054-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Retrieve required segmentation model
        run: bash tools/fetch_models.sh
      - name: Compile and test
        run: |
          set +e
          bash gradlew --no-daemon :core:test :app:assembleDebug > usb-054-build.log 2>&1
          code=$?
          tail -n 95 usb-054-build.log
          if [ "$code" -ne 0 ]; then
            grep -E '(^e: |FAILED|Could not resolve|Could not find|Error: |error: |What went wrong:)' usb-054-build.log | head -45 || true
          fi
          exit "$code"
      - name: APK file and checksum
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload temporary diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: CherryVideo-0.5.4-Xiaomi13T-UVC-Hotfix-TEMP
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error

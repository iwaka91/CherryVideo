name: Clean temporary USB camera APK artifact
on:
  push:
    branches: [feature/usb-uvc-camera]
    paths:
      - '.github/workflows/usb-cleanup.yml'
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the single downloaded USB APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/14541344881"
          echo "Temporary USB APK artifact #14541344881 deleted."

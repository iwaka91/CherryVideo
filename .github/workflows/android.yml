name: Android qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tege-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QEMU_AUDIO_DRV: alsa
      ALSA_CONFIG_PATH: ${{ github.workspace }}/tools/asound.conf
      CHERRY_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Retain personal test signing identity
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: cherry-hotfix-test-signing-v1
      - name: Initialize explicit test signing identity if missing
        run: |
          mkdir -p .signing
          if [ ! -f "$CHERRY_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$CHERRY_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Prepare native audio toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native audio regression
        run: |
          python3 -m pip install numpy==2.2.6
          mkdir -p build/device-evidence
          gcc -O2 -shared -fPIC -DFLOATING_POINT -DUSE_SMALLFT -DEXPORT= -Icamera/src/main/cpp/speexdsp/include -Icamera/src/main/cpp/speexdsp/libspeexdsp camera/src/main/cpp/cherry_denoiser.c camera/src/main/cpp/speexdsp/libspeexdsp/{preprocess,mdf,fftwrap,filterbank,smallft}.c -lm -o build/libcherry_audio_host.so
          python3 tools/check_audio.py "$PWD/build/libcherry_audio_host.so" > build/device-evidence/audio-host.json
      - name: Fetch on-device segmentation model
        run: bash tools/fetch_models.sh
      - name: Compile, lint and JVM tests
        run: |
          set +e
          bash gradlew --no-daemon :core:test :camera:lintDebug :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest > gradle.log 2>&1
          code=$?
          tail -n 25 gradle.log
          if [ $code -ne 0 ]; then
            grep -E '^e: |FAILED|Lint found|Error: |error: ' gradle.log | awk '!seen[$0]++' | head -9 | while IFS= read -r line; do echo "::error title=Gradle::${line:0:380}"; done
          fi
          exit $code
      - name: Report APK size and native libraries
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          echo "::notice title=Ukuran APK::$(stat -c %s $apk) byte"
          unzip -lv "$apk" | awk '/lib\/|\.tflite/ {print $1, $3, $8}' | while read -r size packed name; do echo "::notice title=Isi APK::$name $size byte (terkemas $packed)"; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare encoded-video inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libasound2-dev
      - name: Device tests, real GLES and camera-emulator recording
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated -memory 3072 -cores 4
          script: bash tools/device-tests.sh build/device-evidence/api35
      - name: Android 16 regression tests
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated -memory 3072 -cores 4
          script: bash tools/device-tests.sh build/device-evidence/api36
      - name: Independently inspect encoded videos
        run: |
          python3 tools/check_evidence.py --self-test
          python3 tools/check_evidence.py build/device-evidence
      - name: Package only qualified APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cherry-Video-0.3.2-beta4.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Cherry-Video-0.3.2-beta4.apk
      - name: Upload passing APK
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Video-qualified-apk
          path: dist/
          if-no-files-found: error
      - name: Publish personal testing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" dist/* --prerelease --title "Cherry Video 0.3.2 beta4 · internal gates passed" --notes-file docs/RELEASE_NOTES.md
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Video-test-evidence
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            core/build/test-results/
            camera/build/reports/
            build/device-evidence/
          if-no-files-found: warn

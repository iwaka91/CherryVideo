name: Android qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tege-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QEMU_AUDIO_DRV: pa
      QEMU_PA_SERVER: tcp:127.0.0.1:4713
      QEMU_PA_SINK: cherry_test
      QEMU_PA_SOURCE: cherry_test.monitor
      PULSE_SINK: cherry_test
      PULSE_SOURCE: cherry_test.monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Retain personal test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tege-private-test-signing-v1
      - name: Compile, lint and JVM tests
        run: bash gradlew --no-daemon :core:test :camera:lintDebug :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start a reference virtual microphone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cherry_test rate=48000 channels=2
          pactl set-default-sink cherry_test
          pactl set-default-source cherry_test.monitor
          pactl load-module module-native-protocol-tcp listen=127.0.0.1 port=4713 auth-anonymous=1
          pactl --server=tcp:127.0.0.1:4713 info
          nohup ffmpeg -nostdin -loglevel error -re -f lavfi -i sine=frequency=880:sample_rate=48000 -f pulse 'Cherry CI reference' > /tmp/cherry-tone.log 2>&1 &
          ffmpeg -v error -f pulse -i cherry_test.monitor -t 1 -f f32le - | python3 -c 'import array,sys,math; s=array.array("f",sys.stdin.buffer.read()); rms=math.sqrt(sum(x*x for x in s)/len(s)); print("Host reference RMS:",rms); assert rms>.001'
      - name: Device tests, real GLES and camera-emulator recording
        env:
          PULSE_SERVER: tcp:127.0.0.1:4713
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated -memory 3072 -cores 4
          script: bash tools/device-tests.sh build/device-evidence/api35
      - name: Android 16 regression tests
        env:
          PULSE_SERVER: tcp:127.0.0.1:4713
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated -memory 3072 -cores 4
          script: bash tools/device-tests.sh build/device-evidence/api36
      - name: Independently inspect encoded videos
        run: |
          python3 tools/check_evidence.py --self-test
          python3 tools/check_evidence.py build/device-evidence
      - name: Package only qualified APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cherry-Video-0.2.0-beta.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Cherry-Video-0.2.0-beta.apk
      - name: Upload passing APK
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Video-qualified-apk
          path: dist/
          if-no-files-found: error
      - name: Publish personal testing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" dist/* --prerelease --title "Cherry Video 0.2.0 beta · internal gates passed" --notes-file docs/RELEASE_NOTES.md
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Video-test-evidence
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            core/build/test-results/
            camera/build/reports/
            build/device-evidence/
          if-no-files-found: warn

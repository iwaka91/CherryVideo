name: Android qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tege-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Retain personal test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tege-private-test-signing-v1
      - name: Compile, lint and JVM tests
        run: bash gradlew --no-daemon :core:test :camera:lintDebug :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare encoded-video and virtual-microphone inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m venv /tmp/cherry-grpc-venv
          /tmp/cherry-grpc-venv/bin/pip install --quiet grpcio-tools
      - name: Device tests, real GLES and camera-emulator recording
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated -memory 3072 -cores 4 -grpc 8554
          script: bash tools/device-tests.sh build/device-evidence/api35
      - name: Android 16 regression tests
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated -memory 3072 -cores 4 -grpc 8554
          script: bash tools/device-tests.sh build/device-evidence/api36
      - name: Independently inspect encoded videos
        run: |
          python3 tools/check_evidence.py --self-test
          python3 tools/check_evidence.py build/device-evidence
      - name: Package only qualified APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cherry-Video-0.2.0-beta.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Cherry-Video-0.2.0-beta.apk
      - name: Upload passing APK
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Video-qualified-apk
          path: dist/
          if-no-files-found: error
      - name: Publish personal testing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" dist/* --prerelease --title "Cherry Video 0.2.0 beta · internal gates passed" --notes-file docs/RELEASE_NOTES.md
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Video-test-evidence
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            core/build/test-results/
            camera/build/reports/
            build/device-evidence/
          if-no-files-found: warn

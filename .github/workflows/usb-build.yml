name: USB camera APK build (temporary artifact)
on:
  push:
    branches: [feature/usb-uvc-camera]
    paths:
      - '.github/workflows/usb-build.yml'
      - 'docs/USB_BUILD_TRIGGER.md'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build-usb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record build run reference in PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/1/comments -f body='USB temporary build run #${{ github.run_id }} started, commit ${{ github.sha }}.'
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Fetch segmentation model required by Cherry Video
        run: bash tools/fetch_models.sh
      - name: Build USB camera debug APK
        run: |
          set +e
          bash gradlew --no-daemon :app:assembleDebug > usb-build.log 2>&1
          code=$?
          tail -n 90 usb-build.log
          if [ "$code" -ne 0 ]; then
            grep -E '(^e: |FAILED|Could not resolve|Error: |error: |What went wrong:)' usb-build.log | head -35 || true
          fi
          exit "$code"
      - name: APK size
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload temporary APK only
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Video-USB-0.5.2-beta-temporary
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
      - name: Report run result in PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/1/comments -f body='USB temporary build run #${{ github.run_id }} finished: ${{ job.status }}; check artifact on success. No release created.'
